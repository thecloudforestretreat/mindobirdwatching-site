<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MBW Admin | Species Library</title><meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/css/admin.css?v=7"><link rel="stylesheet" href="/assets/css/birding.css?v=3">
</head>
<body data-admin-layout="birding">
  <div data-admin-nav data-admin-page="birding"></div>
  <main class="birdingShell">
    <section class="birdingHero"><header class="birdingTop"><div class="birdingBrand"><img src="https://mindobirdwatching.com/assets/images/logo/mbw-logo-mark-1024.png" alt="Mindo Bird Watching"><div><h1>Species Library</h1><p>Images, names, routes, planning data, and available bird audio.</p></div></div><div class="birdingActions"><a class="birdingButton" href="/birding/">← Birding</a><button class="birdingButton birdingButton--primary" id="refreshButton" type="button">Refresh</button></div></header></section>
    <section class="birdingPanel">
      <div class="birdingPanelHead"><div><h2>Bird catalog</h2><p class="birdingLead">Search in English or Spanish. Audio appears when MBW already has a recording.</p></div><span class="birdingBadge" id="countBadge">Loading</span></div>
      <div class="birdingControls"><div class="birdingField"><label for="searchInput">Search birds</label><input id="searchInput" type="search" placeholder="Toucan, tucán, quetzal, species code…" autocomplete="off"></div><div class="birdingField"><label for="routeFilter">Route</label><select id="routeFilter"><option value="">All routes</option></select></div><div class="birdingField"><label for="audioFilter">Audio</label><select id="audioFilter"><option value="">All birds</option><option value="yes">Audio available</option><option value="no">No audio yet</option></select></div></div>
      <p class="birdingStatus" id="status">Loading the species catalog…</p>
      <div class="birdingSpeciesGrid" id="speciesGrid"></div>
    </section>
  </main>
  <script defer src="/assets/js/admin-nav.js?v=7"></script>
  <script>
  (()=>{"use strict";
    const API="https://mindobirdwatching.com/api/admin/bird-species";let birds=[];
    const $=id=>document.getElementById(id);const esc=value=>String(value??"").replace(/[&<>\"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[ch]));
    function render(){const q=$("searchInput").value.trim().toLowerCase(),route=$("routeFilter").value,audio=$("audioFilter").value;const filtered=birds.filter(b=>{const hay=[b.englishName,b.spanishName,b.scientificName,b.speciesCode].join(" ").toLowerCase();return(!q||hay.includes(q))&&(!route||b.routeCluster===route)&&(!audio||(audio==="yes"?Boolean(b.audio):!b.audio))});$("countBadge").textContent=filtered.length+" birds";$("speciesGrid").innerHTML=filtered.slice(0,120).map(b=>`<article class="birdingSpecies"><img loading="lazy" src="${esc(b.image||"")}" alt="${esc(b.englishName)}" onerror="this.src='https://mindobirdwatching.com/assets/images/birds/mbw_image_coming_soon_02.jpg'"><div class="birdingSpeciesBody"><h3>${esc(b.englishName)}</h3><small>${esc(b.spanishName||"Spanish name pending")}</small><small><em>${esc(b.scientificName||"")}</em> · ${esc(b.speciesCode||"")}</small><div class="birdingSpeciesMeta"><span class="birdingPill">${esc(b.routeLabelEn||b.routeCluster||"Route pending")}</span><span class="birdingPill">${esc(b.priority||"standard")}</span></div>${b.audio?`<audio class="birdingAudio" controls preload="none" src="${esc(b.audio)}"></audio>`:"<small>Audio not added yet</small>"}</div></article>`).join("")||'<div class="birdingEmpty">No birds match those filters.</div>';$("status").textContent=filtered.length>120?`Showing the first 120 of ${filtered.length} matching birds. Refine the search to narrow the list.`:`Showing ${filtered.length} matching bird${filtered.length===1?"":"s"}.`;$("status").dataset.tone="success"}
    async function load(){$("status").textContent="Loading the species catalog…";$("status").dataset.tone="";try{const response=await fetch(API,{cache:"no-store"});if(!response.ok)throw new Error(`Species API returned ${response.status}`);const data=await response.json();birds=Array.isArray(data.birds)?data.birds:[];const routes=[...new Map(birds.filter(b=>b.routeCluster).map(b=>[b.routeCluster,b.routeLabelEn||b.routeCluster])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));$("routeFilter").innerHTML='<option value="">All routes</option>'+routes.map(([key,label])=>`<option value="${esc(key)}">${esc(label)}</option>`).join("");render()}catch(error){$("status").textContent=error.message+". The API must be deployed before the library can load.";$("status").dataset.tone="error";$("speciesGrid").innerHTML='<div class="birdingEmpty">The page is ready, but the species API is not connected yet.</div>';$("countBadge").textContent="Unavailable"}}
    ["searchInput","routeFilter","audioFilter"].forEach(id=>$(id).addEventListener(id==="searchInput"?"input":"change",render));$("refreshButton").addEventListener("click",load);load();
  })();
  </script>
</body></html>
