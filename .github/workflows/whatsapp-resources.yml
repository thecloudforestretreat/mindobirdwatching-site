name: Refresh WhatsApp website resources
on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sitemap*.xml'
      - '**/*.html'
      - 'admin/assets/data/whatsapp-resource-catalog.json'
      - 'scripts/refresh-whatsapp-resources.py'
      - '.github/workflows/whatsapp-resources.yml'
permissions:
  contents: write
concurrency:
  group: whatsapp-resource-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Scan published sitemap and curated resources
        run: python3 scripts/refresh-whatsapp-resources.py --live
      - name: Publish updated resource index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/assets/data/whatsapp-resources.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh WhatsApp website resource index'
            git push origin HEAD:main
          fi
